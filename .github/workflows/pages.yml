# Builds the read-only static demo and publishes it to GitHub Pages:
# https://socqapi.github.io/open-social-listening/
# Pull requests only build it, so a change that breaks the demo shows up before it is merged.
name: Demo on GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static demo
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:demo -- /open-social-listening
      - name: Check the export
        run: |
          for page in index.html p/1/inbox/index.html p/1/dashboard/index.html p/1/settings/index.html onboarding/index.html sql/sql-wasm.wasm; do
            test -s "out/$page" || { echo "missing out/$page"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
